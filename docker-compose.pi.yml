version: "3.9"

# Etappe 4c (catrin/Docky, 13.10.2026): Erst-Deploy auf dem Raspberry Pi
# (ARM64). Backend-Port 8100 und Frontend-Port 3000 bewusst so gewaehlt,
# damit Port 8000 fuer SortNext/belegsortierung auf demselben Pi frei
# bleibt. Alle Basis-Images (python:3.12-slim, node:20-slim,
# pgvector/pgvector:pg16) sind multi-arch und laufen nativ auf ARM64 --
# kein --platform-Zwang noetig, Docker waehlt die passende Variante
# selbst.

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: scriptnext
      POSTGRES_PASSWORD: ${SCRIPTNEXT_DB_PASSWORT:?Bitte SCRIPTNEXT_DB_PASSWORT in .env setzen}
      POSTGRES_DB: scriptnext
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scriptnext"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    ports:
      - "8100:8000"
    environment:
      SCRIPTNEXT_DATABASE_URL: postgresql+asyncpg://scriptnext:${SCRIPTNEXT_DB_PASSWORT}@db:5432/scriptnext
      SCRIPTNEXT_DATABASE_URL_SYNC: postgresql://scriptnext:${SCRIPTNEXT_DB_PASSWORT}@db:5432/scriptnext
      SCRIPTNEXT_JWT_SECRET: ${SCRIPTNEXT_JWT_SECRET:?Bitte SCRIPTNEXT_JWT_SECRET in .env setzen}
      SCRIPTNEXT_PGVECTOR_ENABLED: "true"
      # Bootstrap-Admin (Klartext-Passwort nur hier in der .env, niemals in
      # der Datenbank -- siehe app._sicherstelle_dev_admin()).
      SCRIPTNEXT_ADMIN_EMAIL: ${SCRIPTNEXT_ADMIN_EMAIL:?Bitte SCRIPTNEXT_ADMIN_EMAIL in .env setzen}
      SCRIPTNEXT_ADMIN_PASSWORT: ${SCRIPTNEXT_ADMIN_PASSWORT:?Bitte SCRIPTNEXT_ADMIN_PASSWORT in .env setzen}
      SCRIPTNEXT_CORS_ALLOWED_ORIGINS: ${SCRIPTNEXT_CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      # Optional, je nach genutzten Features:
      SCRIPTNEXT_OPENAI_API_KEY: ${SCRIPTNEXT_OPENAI_API_KEY:-}
      SCRIPTNEXT_ANTHROPIC_API_KEY: ${SCRIPTNEXT_ANTHROPIC_API_KEY:-}
      SCRIPTNEXT_SHAREPOINT_CLIENT_ID: ${SCRIPTNEXT_SHAREPOINT_CLIENT_ID:-}
      SCRIPTNEXT_SHAREPOINT_TOKEN_KEY: ${SCRIPTNEXT_SHAREPOINT_TOKEN_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      # ACHTUNG (siehe Report an Docky/Weby): NEXT_PUBLIC_API_BASE wird von
      # Next.js beim "npm run build" in den Client-Bundle einkompiliert --
      # ein hier via "environment:" gesetzter Wert wirkt NICHT mehr, das
      # Dockerfile muesste diesen build arg zuerst per ARG/ENV uebernehmen.
      args:
        NEXT_PUBLIC_API_BASE: ${SCRIPTNEXT_FRONTEND_API_BASE:-http://localhost:8100}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
